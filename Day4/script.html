<body>
  <h1 id="name"></h1>

  <script>

    let student = {
      name:"John Doe",
      course:"Web Development"  
    };

    document.getElementById("name").innerText = student.name;
    document.getElementById("course").innerText = student.course;

    document.getElementById("name").innerText = "Hi Hasna!";

    document.getElementById("name").style.color = "blue";

    
    document.getElementById("btn").onclick = function changeColor(){
      document.getElementById("course").style.backgroundColor = "yellow";

    }
  </script>
</body>
