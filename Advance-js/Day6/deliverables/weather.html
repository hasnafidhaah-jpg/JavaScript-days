
<!DOCTYPE html>
<html>
<head><title>Weather</title></head>
<body>
  <input id="city" placeholder="Enter city - ex: Kochi" />
  <button onclick="searchWeather()">Search</button>
  <div id="status"></div>
  <div id="result"></div>

<script>
// api.js part - API fetch
async function getWeather(city) {
  
  const res = await fetch(`https://wttr.in/${city}?format=j1`);
  if(!res.ok) throw new Error("City not found");
  return res.json();
}

// states.js part - loading, error, search
let state = { isLoading: false, isError: false, data: null }

async function searchWeather() {
  const city = document.getElementById('city').value || "Kochi";
  const status = document.getElementById('status');
  const result = document.getElementById('result');

  try {
    state.isLoading = true; state.isError = false;
    status.innerText = "Loading..."; // loading state
    result.innerHTML = "";

    const data = await getWeather(city);
    
    state.isLoading = false; state.data = data;
    status.innerText = "";
    
    const temp = data.current_condition[0].temp_C;
    const desc = data.current_condition[0].weatherDesc[0].value;
    
    // filtering example: only show if temp > 0
    result.innerHTML = `<h2>${city}</h2><p>${temp}°C - ${desc}</p>`;

  } catch(err) {
    state.isLoading = false; state.isError = true;
    status.innerText = "Error: " + err.message; // error state
  }
}
searchWeather();
</script>
</body>
</html>
