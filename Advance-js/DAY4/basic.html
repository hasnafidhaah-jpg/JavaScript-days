<!DOCTYPE html>
<html>
<body>
  <ul id="list"></ul>
  <button onclick="prev()">Prev</button>
  <button onclick="next()">Next</button>
  <p id="pageNo"></p>

  <script>
    let page = 1;
    let limit = 3; 

    async function getUsers() {
      document.getElementById("pageNo").innerText = "Page: " + page;
      
      
      let res = await fetch(`https://jsonplaceholder.typicode.com/users?_page=${page}&_limit=${limit}`);
      let data = await res.json();

      let list = document.getElementById("list");
      list.innerHTML = ""; // pazhaya data clear aakku

      data.forEach(u => {
        let li = document.createElement("li");
        li.innerText = u.name;
        list.appendChild(li);
      });
    }

    function next() {
      page++;
      getUsers();
    }

    function prev() {
      if (page > 1) {
        page--;
        getUsers();
      }
    }

    getUsers(); 
  </script>
</body>
</html>
